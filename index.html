<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#20231e">
    <title>URBAN THREAD — A new everyday</title>
    <style>
        :root { --paper: #f2f0e9; --ink: #20231e; --accent: #d84f32; --olive: #d9dfc2; }
        * { box-sizing: border-box; }
        body { min-height: 100vh; margin: 0; overflow: hidden; background: var(--ink); color: var(--paper); font-family: Arial, Helvetica, sans-serif; }
        .intro { position: relative; min-height: 100vh; padding: 28px 6vw; display: flex; flex-direction: column; justify-content: space-between; isolation: isolate; opacity: 1; transform: scale(1); filter: blur(0); transition: opacity .75s ease, transform .75s ease, filter .75s ease; }
        .intro.is-leaving { opacity: 0; transform: scale(1.025); filter: blur(8px); pointer-events: none; }
        .intro::before { position: absolute; z-index: -1; top: 50%; left: 50%; width: min(74vw, 780px); aspect-ratio: 1; border: 1px solid rgba(242,240,233,.09); border-radius: 50%; content: ""; transform: translate(-50%, -50%); animation: breathe 3.2s ease-in-out infinite; }
        .intro::after { position: absolute; z-index: -1; top: 50%; left: 50%; width: min(58vw, 600px); aspect-ratio: 1; border: 1px solid rgba(242,240,233,.07); border-radius: 50%; content: ""; transform: translate(-50%, -50%); }
        .topline, .bottomline { display: flex; justify-content: space-between; align-items: center; gap: 20px; font-size: 10px; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }
        .brand { font-size: 18px; font-weight: 900; letter-spacing: -.08em; }
        .brand span { color: var(--accent); }
        .season { color: #a9aa9f; }
        .center { display: flex; flex-direction: column; align-items: center; text-align: center; }
        .eyebrow { color: var(--olive); font-size: 10px; font-weight: 800; letter-spacing: .28em; text-transform: uppercase; animation: fade-up .8s both; }
        h1 { margin: 22px 0 10px; font-size: clamp(70px, 16vw, 190px); line-height: .78; letter-spacing: -.105em; text-transform: uppercase; animation: fade-up .9s .08s both; }
        h1 span { color: var(--accent); }
        .tagline { margin: 20px 0 38px; color: #c1c2b9; font-size: clamp(12px, 1.5vw, 16px); letter-spacing: .08em; animation: fade-up .9s .16s both; }
        .loader { width: min(260px, 60vw); }
        .loader-meta { display: flex; justify-content: space-between; margin-bottom: 9px; color: #b0b1a8; font-size: 9px; font-weight: 700; letter-spacing: .16em; text-transform: uppercase; }
        .track { height: 2px; overflow: hidden; background: #505149; }
        .progress { width: 0; height: 100%; background: var(--accent); animation: load 2.8s cubic-bezier(.65, 0, .35, 1) forwards; }
        .bottomline span:last-child { color: #9c9d93; text-align: right; }
        @keyframes load { to { width: 100%; } }
        @keyframes fade-up { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes breathe { 50% { opacity: .35; transform: translate(-50%, -50%) scale(1.05); } }
        @media (max-width: 520px) {
            .intro { padding: 22px 6vw; }
            .season { max-width: 95px; text-align: right; line-height: 1.6; }
            .bottomline { align-items: flex-end; font-size: 8px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; scroll-behavior: auto !important; transition-duration: .01ms !important; }
        }
    </style>
</head>
<body>
    <main class="intro">
        <div class="topline">
            <a class="brand intro-link" href="public/customer.html">URBAN<span>.</span>THREAD</a>
            <span class="season">Independent essentials / 2026</span>
        </div>

        <section class="center" aria-label="Welcome to Urban Thread">
            <div class="eyebrow">Good clothes. Real life.</div>
            <h1>Make it<br>your<span>.</span>s</h1>
            <p class="tagline">Everyday pieces. Your own story.</p>
            <div class="loader" role="status" aria-live="polite">
                <div class="loader-meta"><span id="loader-label">Opening the collection</span><span id="loader-percent">00%</span></div>
                <div class="track"><div class="progress"></div></div>
            </div>
        </section>

        <div class="bottomline">
            <span>Designed to be lived in</span>
            <span>Collection / 001</span>
        </div>
    </main>
    <script>
        const destination = 'public/customer.html';
        const duration = 2800;
        const startedAt = performance.now();
        const intro = document.querySelector('.intro');
        const percent = document.getElementById('loader-percent');
        const label = document.getElementById('loader-label');
        let isLeaving = false;

        function enterStore() {
            if (isLeaving) return;
            isLeaving = true;
            intro.classList.add('is-leaving');
            window.setTimeout(() => window.location.replace(destination), 750);
        }

        document.querySelectorAll('.intro-link').forEach(link => {
            link.addEventListener('click', event => {
                event.preventDefault();
                enterStore();
            });
        });

        function updateIntro(now) {
            if (isLeaving) return;
            const progress = Math.min((now - startedAt) / duration, 1);
            percent.textContent = `${Math.round(progress * 100).toString().padStart(2, '0')}%`;
            if (progress >= 1) {
                label.textContent = 'Collection ready';
                enterStore();
                return;
            }
            window.requestAnimationFrame(updateIntro);
        }

        window.requestAnimationFrame(updateIntro);
    </script>
</body>
</html>
